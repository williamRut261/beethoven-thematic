name: One-shot Beethoven research backtest (NO TRADING)
on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'data/**'
      - 'catalog/**'
      - 'tests/**'
      - '.github/workflows/research.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install analysis dependencies
        run: python -m pip install --disable-pip-version-check "numpy>=1.26,<3" "pandas>=2.1,<3" "yfinance>=0.2.55,<1" "pytest>=8,<10"
      - name: Structural and causal tests (no broker)
        run: python -m pytest -q tests
      - name: Compare predeclared regimes over identical historical windows
        run: python -m src.research
      - name: Search finite risk-budget combinations under delayed execution (20bps)
        run: python -m src.grid_search
      - name: Preserve numerical evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: beethoven-exploratory-backtest
          path: evidence/
          retention-days: 30
